<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Siri Pro</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; min-height:100%; background:#0b0d12; color:#f5f7fb;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",sans-serif; }
  body { padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom); }
  .app { max-width: 520px; margin:0 auto; min-height:100vh; padding:54px 0 28px; }
  .top { text-align:center; margin-bottom:34px; }
  .orb { width:78px; height:78px; margin:0 auto 18px; border-radius:26px;
    display:grid; place-items:center; font-size:38px;
    background:linear-gradient(145deg,#242936,#11141c);
    box-shadow:0 16px 45px rgba(0,0,0,.45), inset 0 1px 1px rgba(255,255,255,.08); }
  h1 { margin:0; font-size:34px; letter-spacing:-1.2px; }
  .sub { margin:8px 0 0; color:#9da5b5; font-size:15px; }
  .menu { display:grid; gap:13px; }
  button { width:100%; border:0; border-radius:20px; padding:19px 20px;
    background:#171a22; color:#fff; text-align:left; font:600 17px inherit;
    box-shadow:0 8px 24px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.045);
    display:flex; align-items:center; gap:15px; cursor:pointer; }
  button:active { transform:scale(.985); background:#20242e; }
  .icon { width:42px; height:42px; border-radius:14px; display:grid; place-items:center;
    font-size:22px; background:#232733; flex:0 0 42px; }
  .label { flex:1; }
  .arrow { color:#737b8b; font-size:22px; }
  .footer { text-align:center; color:#626a79; font-size:12px; margin-top:28px; }
  .toast { position:fixed; left:20px; right:20px; bottom:calc(20px + env(safe-area-inset-bottom));
    max-width:480px; margin:auto; padding:14px 16px; border-radius:16px;
    background:#20242e; color:#fff; text-align:center; opacity:0; transform:translateY(12px);
    pointer-events:none; transition:.22s ease; }
  .toast.show { opacity:1; transform:translateY(0); }
</style>
</head>
<body>
<main class="app">
  <section class="top">
    <div class="orb">🧠</div>
    <h1>Siri Pro</h1>
    <p class="sub">Deine persönliche KI</p>
  </section>

  <section class="menu">
    <button onclick="notify('🎙️ Schnelle Antwort ist bereit – die Verbindung zum Kurzbefehl kommt als Nächstes.')">
      <span class="icon">🎙️</span><span class="label">Schnelle Antwort</span><span class="arrow">›</span>
    </button>
    <button onclick="notify('💬 Langes Gespräch ist bereit – die Verbindung kommt als Nächstes.')">
      <span class="icon">💬</span><span class="label">Langes Gespräch</span><span class="arrow">›</span>
    </button>
    <button onclick="notify('💬 Normaler Chat ist bereit – die Verbindung kommt als Nächstes.')">
      <span class="icon">💬</span><span class="label">Normaler Chat</span><span class="arrow">›</span>
    </button>
    <button onclick="notify('🌦️ Wetter ist bereit – die Verbindung kommt als Nächstes.')">
      <span class="icon">🌦️</span><span class="label">Wetter</span><span class="arrow">›</span>
    </button>
    <button onclick="notify('⚙️ Einstellungen bauen wir als Nächstes ein.')">
      <span class="icon">⚙️</span><span class="label">Einstellungen</span><span class="arrow">›</span>
    </button>
  </section>

  <div class="footer">Siri Pro · Version 1</div>
</main>

<div id="toast" class="toast"></div>
<script>
let timer;
function notify(text){
  const t=document.getElementById('toast');
  t.textContent=text; t.classList.add('show');
  clearTimeout(timer); timer=setTimeout(()=>t.classList.remove('show'),2800);
}
</script>
</body>
</html>
